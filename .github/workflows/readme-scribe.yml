name: Update README.md

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:  # Manuelles Auslösen möglich

jobs:
  markscribe:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Verhindert hängende Jobs

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate README.md
        id: generate
        # The fork of muesli/readme-scribe: markscribe built with a current Go
        # toolchain, one pinned image per release.
        uses: freifunkMUC/readme-scribe@54a897aa78f9ca7c31e3b27182ce7bc0dab23384 # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        with:
          template: "templates/README.md.tpl"
          writeTo: "README.md"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet README.md || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: steps.changes.outputs.changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "📚 docs: Update generated README [skip ci]"
          branch: main
          commit_user_name: "readme-scribe 🤖"
          commit_user_email: "actions@github.com"
          commit_author: "readme-scribe 🤖 <actions@github.com>"
          file_pattern: README.md

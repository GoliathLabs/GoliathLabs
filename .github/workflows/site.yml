name: Build site image

# Renders site/ with Hugo and publishes it twice: as an nginx image, which
# is what serves felix-golatofski.de, and as a copy on GitHub Pages. The
# hourly README commit touches nothing under site/ and never starts this.
on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:
  # The site shows a list from the README, which changes without a push
  # that would start this (the hourly commit carries "[skip ci]"). Once a
  # night is current enough. A night builds only if the content changed, the
  # published image has pending Alpine package upgrades, or its base image
  # is not the one site/Dockerfile pins; otherwise the published digest stays.
  schedule:
    # Not at minute 0: GitHub delays or drops scheduled runs at the start of
    # the hour.
    - cron: "37 3 * * *"

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the site is made of, as one hash: everything under site/, this
  # workflow, and the list from the README without the ages of its
  # entries. The image carries the hash as a tag; a nightly run that finds
  # the tag has nothing to do.
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      packages: read

    outputs:
      tag: ${{ steps.hash.outputs.tag }}
      build: ${{ steps.hash.outputs.build }}
      no_cache: ${{ steps.hash.outputs.no_cache }}
      base_name: ${{ steps.hash.outputs.base_name }}
      base_digest: ${{ steps.hash.outputs.base_digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        if: github.event_name == 'schedule'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Hash the content
        id: hash
        run: |
          list=$(awk 'tolower($0) ~ /^####.*currently working on/ {f=1; next} /^####/ {f=0} f' README.md |
            sed -E 's/[[:space:]]+\([^()]*\)[[:space:]]*$//' | grep '^- ' || true)
          hash=$( { git ls-files -s site .github/workflows/site.yml; printf '%s\n' "$list"; } | sha256sum | cut -c1-16)
          image="ghcr.io/goliathlabs/website"
          tag="content-$hash"

          # The base the last stage of site/Dockerfile builds on: name and
          # digest as pinned there.
          from=$(sed -n 's/^FROM \([^ ]*\)\( .*\)\{0,1\}$/\1/p' site/Dockerfile | tail -n1)
          base_name="${from%@*}"
          base_digest="${from#*@}"
          case "$base_digest" in sha256:*) ;; *) echo "Last FROM in site/Dockerfile is not pinned by digest" >&2; exit 1 ;; esac

          build=true no_cache=false
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            if ! out=$(docker manifest inspect "$image:$tag" 2>&1); then
              if ! grep -qiE 'no such manifest|not found|manifest unknown' <<< "$out"; then
                echo "Cannot probe $image:$tag: $out" >&2
                exit 1
              fi
              echo "Content changed"
            else
              # Nothing new in the content: only a stale image is a reason.
              # A failing "apk update" or "docker run" must not look like
              # "nothing pending".
              build=false
              docker pull --quiet --platform linux/amd64 "$image:$tag" > /dev/null || exit 1
              upgrade=$(docker run --rm --platform linux/amd64 --user 0 --entrypoint sh "$image:$tag" \
                -c 'apk update >/dev/null && apk upgrade --simulate') || exit 1
              pending=$(grep -c ' Upgrading ' <<< "$upgrade" || true)
              built_from=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' "$image:$tag")
              echo "Pending upgrades: $pending"
              echo "Base digest: published ${built_from:-none}, pinned $base_digest"
              if [ "$pending" -gt 0 ] || [ "$built_from" != "$base_digest" ]; then
                build=true no_cache=true
              else
                echo "up to date"
              fi
            fi
          fi

          {
            echo "tag=$tag"
            echo "build=$build"
            echo "no_cache=$no_cache"
            echo "base_name=$base_name"
            echo "base_digest=$base_digest"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: content
    if: needs.content.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # layouts/_partials/activity.html reads the list from this copy.
      - name: Copy the README into the site
        run: cp README.md site/assets/profile-readme.md

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/goliathlabs/website
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.content.outputs.tag }},enable={{is_default_branch}}
            type=raw,value=v{{date 'YYYYMMDD-HHmm' tz='Europe/Berlin'}},enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.base.name=${{ needs.content.outputs.base_name }}
            org.opencontainers.image.base.digest=${{ needs.content.outputs.base_digest }}

      # A pull request only proves that the site still builds.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: site
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # A rebuild for pending upgrades must not reuse the cached
          # "apk upgrade" layer.
          no-cache: ${{ needs.content.outputs.no_cache == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The same site at the repository's GitHub Pages address, built for that
  # address: a copy to look at, not a second home.
  pages:
    needs: content
    if: github.event_name != 'pull_request' && needs.content.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy the README into the site
        run: cp README.md site/assets/profile-readme.md

      - name: Pages address
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Render the site
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: site
          target: static
          build-args: |
            HUGO_BASEURL=${{ steps.pages.outputs.base_url }}/
          outputs: type=local,dest=public
          cache-from: type=gha

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

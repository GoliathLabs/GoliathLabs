name: Build site image

# Renders site/ with Hugo and publishes it twice: as an nginx image, which
# is what serves felix-golatofski.de, and as a copy on GitHub Pages. The
# hourly README commit touches nothing under site/ and never starts this.
on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:
  # The site shows a list from the README, which changes without a push
  # that would start this (the hourly commit carries "[skip ci]"). Once a
  # night is current enough; a night without a change builds nothing.
  schedule:
    - cron: "37 3 * * *"

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the site is made of, as one hash: everything under site/, this
  # workflow, and the list from the README without the ages of its
  # entries. The image carries the hash as a tag; a nightly run that finds
  # the tag has nothing to do.
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      tag: ${{ steps.hash.outputs.tag }}
      build: ${{ steps.hash.outputs.build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hash the content
        id: hash
        run: |
          list=$(awk 'tolower($0) ~ /^####.*currently working on/ {f=1; next} /^####/ {f=0} f' README.md |
            sed -E 's/[[:space:]]+\([^()]*\)[[:space:]]*$//' | grep '^- ' || true)
          hash=$( { git ls-files -s site .github/workflows/site.yml; printf '%s\n' "$list"; } | sha256sum | cut -c1-16)
          echo "tag=content-$hash" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = schedule ] &&
            docker manifest inspect "ghcr.io/goliathlabs/website:content-$hash" > /dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: content
    if: needs.content.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # layouts/_partials/activity.html reads the list from this copy.
      - name: Copy the README into the site
        run: cp README.md site/assets/profile-readme.md

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/goliathlabs/website
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.content.outputs.tag }},enable={{is_default_branch}}
            type=sha

      # A pull request only proves that the site still builds.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: site
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The same site at the repository's GitHub Pages address, built for that
  # address: a copy to look at, not a second home.
  pages:
    needs: content
    if: github.event_name != 'pull_request' && needs.content.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy the README into the site
        run: cp README.md site/assets/profile-readme.md

      - name: Pages address
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Render the site
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: site
          target: static
          build-args: |
            HUGO_BASEURL=${{ steps.pages.outputs.base_url }}/
          outputs: type=local,dest=public
          cache-from: type=gha

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

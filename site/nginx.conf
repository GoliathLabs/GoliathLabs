# The site is static files. TLS, the client's address and the access log
# belong to the gateway in front of it, so nothing is logged here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    access_log off;
    server_tokens off;
    charset utf-8;
    # Redirects (a missing trailing slash) must not name port 8080.
    absolute_redirect off;

    gzip on;
    gzip_types text/css text/plain image/svg+xml application/xml;

    # The page loads nothing but its own stylesheet and images.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    # The site does not want to be found: no index entry, no cached copy,
    # no excerpt. layouts/robots.txt and a meta tag say the same.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    error_page 404 /404.html;

    # "expires" instead of add_header: a location with its own add_header
    # would drop the headers above.
    expires 10m;

    # Hugo puts a hash of the content into the stylesheet's name.
    location /css/ {
        expires 1y;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}

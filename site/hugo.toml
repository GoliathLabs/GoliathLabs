baseURL = "https://felix-golatofski.de/"
title = "Felix Golatofski"
locale = "en"
defaultContentLanguage = "en"

# One page and a few plain pages: no lists, no feeds, no taxonomies.
disableKinds = ["taxonomy", "term", "section", "rss", "sitemap"]
# layouts/robots.txt: the site does not want to be found.
enableRobotsTXT = true
disableHugoGeneratorInject = true

[params]
  description = "Felix Golatofski"

  # The sections below the text on the start page, in this order. An entry
  # is one line: "label: text", linked when it has a url. A section may
  # carry a note above its entries. "me = true" on an entry adds rel="me",
  # which lets the linked account verify this site; none is set, on purpose.
  [[params.sections]]
    title = "Contact"
    [[params.sections.entries]]
      label = "Chat"
      text = "TheGoliath on chat.ffmuc.net"
      url = "https://chat.ffmuc.net"
    [[params.sections.entries]]
      label = "Mastodon"
      text = "@TheGoliath@social.ffmuc.net"
      url = "https://social.ffmuc.net/@TheGoliath"

  [[params.sections]]
    title = "Elsewhere"
    [[params.sections.entries]]
      label = "GitHub"
      text = "@GoliathLabs"
      url = "https://github.com/GoliathLabs"
    [[params.sections.entries]]
      label = "Freifunk München"
      text = "github.com/freifunkMUC"
      url = "https://github.com/freifunkMUC"
    [[params.sections.entries]]
      label = "Blog"
      text = "blog.morphnet.work"
      url = "https://blog.morphnet.work"

  # "Currently working on": the first entries of that list in the README of
  # this repository, which a workflow regenerates every hour. The site
  # shows it as of its last build (layouts/_partials/activity.html).
  [params.activity]
    title = "Currently working on"
    entries = 5

[minify]
  minifyOutput = true

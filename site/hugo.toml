baseURL = "https://felix-golatofski.de/"
title = "Felix Golatofski"
locale = "de"
defaultContentLanguage = "de"

# One page and a few plain pages: no lists, no feeds, no taxonomies.
disableKinds = ["taxonomy", "term", "section", "rss"]
enableRobotsTXT = true

[params]
  description = "Felix Golatofski: Systemadministrator, Informatikstudent an der Technischen Hochschule Augsburg, aktiv bei Freifunk München."

  # The sections below the text on the start page, in this order. An entry
  # is one line: "label: text", linked when it has a url. A section may
  # carry a note above its entries. "me = true" marks an account that is
  # the owner's own (rel="me", which Mastodon uses to verify the site).
  [[params.sections]]
    title = "Kontakt"
    [[params.sections.entries]]
      label = "Mastodon"
      text = "@TheGoliath@social.ffmuc.net"
      url = "https://social.ffmuc.net/@TheGoliath"
      me = true

  [[params.sections]]
    title = "Öffentliches"
    [[params.sections.entries]]
      label = "GitHub"
      text = "@GoliathLabs"
      url = "https://github.com/GoliathLabs"
      me = true
    [[params.sections.entries]]
      label = "Freifunk München"
      text = "github.com/freifunkMUC"
      url = "https://github.com/freifunkMUC"
    [[params.sections.entries]]
      label = "Blog"
      text = "blog.morphnet.work"
      url = "https://blog.morphnet.work"
      me = true

[minify]
  minifyOutput = true
